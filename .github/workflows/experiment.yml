name: Experiment

# Tests, structural counters and timing compare Quant with the vendored
# Reflex baseline and alien-signals on one runner. Compare ratios within a
# run, never times across runs. Report-only edits do not re-run the job.

on:
  push:
    branches: [main]
    paths-ignore:
      - "research/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      rounds:
        description: Timing rounds (fresh process per runtime and scenario per round)
        required: false
        default: "9"

permissions:
  contents: read

concurrency:
  group: experiment-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  experiment:
    name: tests, structure, timing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, release build and release check
        run: |
          npm run typecheck
          npm run build
          npm run check

      - name: Tests (spec, contract spec, Reflex and quant; invariants)
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm test

      - name: Build bundles
        run: node bench/build.mjs

      - name: Structural counters
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          node bench/structure.mjs | tee "$GITHUB_WORKSPACE/artifacts/structure.md"
          cp .cache/bench/structure.json "$GITHUB_WORKSPACE/artifacts/"

      - name: Timing
        env:
          ROUNDS: ${{ inputs.rounds || '9' }}
        run: |
          node bench/run.mjs --rounds "$ROUNDS" --out "$GITHUB_WORKSPACE/artifacts/timing.json"
          {
            echo "## Quant vs Reflex vs alien-signals"
            echo
            cat "$GITHUB_WORKSPACE/artifacts/timing.md"
            echo
            echo "## Structural work per step"
            echo
            cat "$GITHUB_WORKSPACE/artifacts/structure.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Isolated edge churn probe
        run: |
          node bench/edge-churn.mjs --rounds 3 --out "$GITHUB_WORKSPACE/artifacts/edge-churn.json" | tee "$GITHUB_WORKSPACE/artifacts/edge-churn.md"
          {
            echo "## Isolated edge churn (ns per edge)"
            echo
            cat "$GITHUB_WORKSPACE/artifacts/edge-churn.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: experiment
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
