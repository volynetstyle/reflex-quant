name: Reorder learning
on:
  workflow_dispatch:
  push:
    branches: [research/reorder-learning]
    paths:
      - "research/reorder-learning*.mjs"
      - "research/reorder-learning.ts"
      - "bench/cost/learning.mjs"
      - "bench/cost/locality-run.mjs"
      - "bench/suites.mjs"
      - ".github/workflows/reorder-learning.yml"
permissions:
  contents: read
jobs:
  contract:
    name: contract ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [observe, thread, witness]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: node research/reorder-learning-build.mjs "${{ matrix.variant }}"
      - run: npx --no-install tsc -p ".cache/reorder-learning/${{ matrix.variant }}/tsconfig.json"
      - run: node --expose-gc research/reorder-learning-witness.mjs "${{ matrix.variant }}"
      - run: node --expose-gc research/reorder-witness.mjs ".cache/reorder-learning/${{ matrix.variant }}/raw-stats/index.mjs"
      - run: npm test
        env:
          QUANT_SRC: .cache/reorder-learning/${{ matrix.variant }}/src
      - run: npm run test:production
        env:
          QUANT_SRC: .cache/reorder-learning/${{ matrix.variant }}/src
  timing:
    needs: contract
    name: ${{ matrix.group }} repeat ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [learn-private, learn-deep, learn-local]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: node bench/build.mjs
      - run: node research/reorder-learning-build.mjs
      - run: node bench/cost/locality-run.mjs "${{ matrix.group }}" 7
        env:
          REPETITION: ${{ matrix.repeat }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.group }}-${{ matrix.repeat }}
          path: .cache/locality-results
          include-hidden-files: true
