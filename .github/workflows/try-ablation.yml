name: Try ablation experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: try-ablation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  full-ablation:
    name: All handlers / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [scenarios, mechanisms]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Record runner and measure
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p artifacts
          lscpu > artifacts/cpu.txt
          cat /proc/self/status | grep -E 'Cpus_allowed|Mems_allowed' >> artifacts/cpu.txt
          cpu=$(awk '/Cpus_allowed_list/ {split($2,a,/[-,]/); print a[1]}' /proc/self/status)
          echo "Pinned logical CPU: $cpu" | tee -a artifacts/cpu.txt
          taskset -c "$cpu" node research/try-ablation.mjs --rounds 10 --suite "$SUITE" | tee artifacts/results.md
          cp .cache/try-ablation/results.json artifacts/results.json
          cat artifacts/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: all-handlers-${{ matrix.suite }}
          path: artifacts/
          retention-days: 30

  sites:
    name: Sites / ${{ matrix.scenario }} / repeat ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            push.chain-cutoff-100,
            push.effects-1000,
            pull.recompute-chain-100,
            pull.diamond-1000,
          ]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Record runner and measure shuffled variants
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          mkdir -p artifacts
          lscpu > artifacts/cpu.txt
          cat /proc/self/status | grep -E 'Cpus_allowed|Mems_allowed' >> artifacts/cpu.txt
          cpu=$(awk '/Cpus_allowed_list/ {split($2,a,/[-,]/); print a[1]}' /proc/self/status)
          echo "Pinned logical CPU: $cpu" | tee -a artifacts/cpu.txt
          taskset -c "$cpu" node research/try-sites.mjs --rounds 10 --cooldown 0 --scenario "$SCENARIO" --label result
          cp .cache/try-sites/result.json artifacts/results.json
          node research/try-sites-report.mjs artifacts/results.json | tee artifacts/results.md
          cat artifacts/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sites-${{ matrix.scenario }}-${{ matrix.repeat }}
          path: artifacts/
          retention-days: 30

  traces:
    name: V8 optimization traces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Capture traces, separately from timing
        run: |
          mkdir -p artifacts
          node research/try-sites.mjs --prepare-only > artifacts/sites.json
          for variant in baseline single-1 single-3 single-5 single-6 cumulative-10; do
            node --trace-turbo-inlining --trace-opt --trace-deopt bench/worker.mjs ".cache/try-sites/$variant" push.effects-1000 --suite mechanisms > "artifacts/$variant.log" 2>&1
          done
          lscpu > artifacts/cpu.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v8-traces
          path: artifacts/
          retention-days: 30
