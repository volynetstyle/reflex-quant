name: Suffix reconstruction
on:
  workflow_dispatch:
    inputs:
      candidate:
        type: choice
        description: Experimental suffix representation
        default: thread
        options: [thread, suffix]
  push:
    branches: [research/reorder-locality]
    paths:
      - "research/reorder-build.mjs"
      - "research/reorder-suffix.ts"
      - "research/reorder-thread.ts"
      - "research/reorder-witness.mjs"
      - ".github/workflows/reorder-suffix.yml"
permissions:
  contents: read
env:
  SUFFIX_CANDIDATE: ${{ inputs.candidate || 'thread' }}
jobs:
  contract:
    name: Contract and graph witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: node research/reorder-build.mjs "$SUFFIX_CANDIDATE"
      - run: npx --no-install tsc -p ".cache/reorder-$SUFFIX_CANDIDATE/tsconfig.json"
      - run: node --expose-gc research/reorder-witness.mjs ".cache/reorder-$SUFFIX_CANDIDATE/raw/index.mjs"
      - run: npm test
        env:
          QUANT_SRC: .cache/reorder-${{ env.SUFFIX_CANDIDATE }}/src
      - run: npm run test:production
        env:
          QUANT_SRC: .cache/reorder-${{ env.SUFFIX_CANDIDATE }}/src

  timing:
    needs: contract
    name: ${{ matrix.group }} repeat ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [global, local, neighbors]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: node bench/build.mjs
      - run: node research/reorder-build.mjs
      - if: env.SUFFIX_CANDIDATE == 'thread'
        run: node research/reorder-build.mjs thread
      - run: node bench/cost/locality-run.mjs "${{ matrix.group }}" 7
        env:
          REPETITION: ${{ matrix.repeat }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SUFFIX_CANDIDATE }}-${{ matrix.group }}-${{ matrix.repeat }}
          path: .cache/locality-results
          include-hidden-files: true
